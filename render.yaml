services:
  - type: web
    name: musicsync
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "8080"
      - key: YOUTUBE_API_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true
